name: red_cell_net_final
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Supabase Backend
  supabase_flutter: ^2.18.3

  # OCR & Media
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1

  # Location & Permissions
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  geocoding: ^3.0.0

  # Maps
  google_maps_flutter: ^2.12.1
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.0
  google_maps_apis: ^1.1.1
  foundation: ^0.0.5
  google_places_sdk: ^1.2.1
  flutter_local_notifications: ^19.0.0

  # HTTP Client
  http: ^1.2.1
  http_parser: ^4.0.0
  dio: ^5.0.0

  # Default Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/google_logo.png
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#bec9cd"
